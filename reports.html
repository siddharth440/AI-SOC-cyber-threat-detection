<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentinelX — Executive Security Reports</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
  <div id="reports-view-marker" style="display:none;"></div>

  <div id="app">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="header-container"></div>

      <main class="page-container">
        <div class="page-header">
          <div class="page-header-title">
            <h1>📈 Executive Security & Incident Reports</h1>
            <p>Generate audit-ready executive threat reports and export directly to PDF</p>
          </div>
          <div class="page-header-actions">
            <button class="btn btn-secondary" onclick="ReportsController.generateReport()">🔄 Refresh Report Data</button>
            <button class="btn btn-primary" onclick="ReportsController.printReport()">🖨️ Print / Save as PDF</button>
          </div>
        </div>

        <div id="report-output-container"></div>
      </main>
    </div>
  </div>

  <script src="./js/utils.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/notifications.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/reports.js"></script>
</body>
</html>
