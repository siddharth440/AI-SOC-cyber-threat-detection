<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentinelX — SOC Settings</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
  <div id="settings-view-marker" style="display:none;"></div>

  <div id="app">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="header-container"></div>

      <main class="page-container">
        <div class="page-header">
          <div class="page-header-title">
            <h1>⚙️ Security Operations Center Settings</h1>
            <p>Configure platform defaults, analyst profile, real-time telemetry stream, and factory resets</p>
          </div>
        </div>

        <div style="max-width:640px;" class="glass-panel" style="padding:24px;">
          <form onsubmit="SettingsController.saveSettings(event)" style="display:flex; flex-direction:column; gap:20px; padding:24px;">
            <div>
              <label style="display:block; font-size:0.85rem; color:var(--text-muted); font-weight:600; margin-bottom:6px;">SOC Organization Name</label>
              <input type="text" id="setting-soc-name" style="width:100%;" required>
            </div>

            <div>
              <label style="display:block; font-size:0.85rem; color:var(--text-muted); font-weight:600; margin-bottom:6px;">Active Analyst Display Name</label>
              <input type="text" id="setting-analyst-name" style="width:100%;" required>
            </div>

            <div style="display:flex; align-items:center; justify-content:space-between; padding:12px; background:rgba(0,0,0,0.2); border-radius:var(--border-radius-sm);">
              <div>
                <strong style="color:var(--text-main); font-size:0.9rem;">Live Simulated Telemetry Stream</strong>
                <p style="font-size:0.8rem; color:var(--text-muted);">Generates automated simulated cyber attacks every 4 seconds</p>
              </div>
              <input type="checkbox" id="setting-live-monitoring" style="width:20px; height:20px;">
            </div>

            <div style="display:flex; justify-content:flex-start; gap:12px; margin-top:12px;">
              <button type="submit" class="btn btn-primary">💾 Save Settings</button>
              <button type="button" class="btn btn-danger" onclick="SettingsController.confirmResetDemoData()">🔄 Reset Demo Data</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="./js/utils.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/notifications.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/settings.js"></script>
</body>
</html>
