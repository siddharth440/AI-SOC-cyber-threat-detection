<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentinelX — MITRE ATT&CK Matrix</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
  <div id="mitre-view-marker" style="display:none;"></div>

  <div id="app">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="header-container"></div>

      <main class="page-container">
        <div class="page-header">
          <div class="page-header-title">
            <h1>⚔️ MITRE ATT&CK® Tactical Mapping</h1>
            <p>Adversary tactics, techniques, and procedures (TTPs) dynamically mapped to current threat alerts</p>
          </div>
        </div>

        <div class="mitre-grid" id="mitre-matrix-grid"></div>
      </main>
    </div>
  </div>

  <!-- MITRE Technique Detail Modal -->
  <div class="modal-overlay" id="mitre-details-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">⚔️ MITRE ATT&CK Technique Details</div>
        <span class="modal-close" onclick="MitreController.closeModal()">&times;</span>
      </div>
      <div class="modal-body" id="mitre-modal-body"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="MitreController.closeModal()">Close</button>
      </div>
    </div>
  </div>

  <script src="./js/utils.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/notifications.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/mitre.js"></script>
</body>
</html>
