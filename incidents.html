<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentinelX — Incident Response Center</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
  <div id="incidents-view-marker" style="display:none;"></div>

  <div id="app">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="header-container"></div>

      <main class="page-container">
        <div class="page-header">
          <div class="page-header-title">
            <h1>🔥 Incident Response & Triage Center</h1>
            <p>Correlated security incidents, workflow state transitions, and investigation timelines</p>
          </div>
        </div>

        <div id="incidents-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:20px;"></div>
      </main>
    </div>
  </div>

  <!-- Incident Details & Timeline Modal -->
  <div class="modal-overlay" id="incident-details-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">🔥 Incident Investigation Timeline</div>
        <span class="modal-close" onclick="IncidentsController.closeModal()">&times;</span>
      </div>
      <div class="modal-body" id="incident-modal-body"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="IncidentsController.closeModal()">Close</button>
      </div>
    </div>
  </div>

  <script src="./js/utils.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/notifications.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/incidents.js"></script>
</body>
</html>
